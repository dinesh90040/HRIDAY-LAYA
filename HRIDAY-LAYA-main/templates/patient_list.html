<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient List - हृदय-lay</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f0f4f8; /* Light background */
      color: #2d3748; /* Dark text */
    }

    .glassmorphism {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .gradient-bg {
      background: linear-gradient(135deg, #a3bffa 0%, #7f9cf5 100%); /* Soft blue gradient */
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid rgba(209, 213, 219, 0.5);
    }

    th {
      background-color: #7f9cf5; /* Soft blue header */
      color: white;
      font-weight: 600;
    }

    tr:hover {
      background-color: rgba(209, 213, 219, 0.2);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="fixed top-0 left-0 w-full z-50 bg-white bg-opacity-80 backdrop-filter backdrop-blur-lg p-4 shadow-lg">
    <div class="container mx-auto flex justify-between items-center">
      <a href="home.html" class="text-3xl font-bold text-gray-800 hover:text-gray-600 transition-colors">हृदय-lay</a>
      <div class="space-x-4">
        <a href="home.html" class="text-gray-800 hover:text-gray-600 transition-colors">Home</a>
        <a href="about_us.txt" class="text-gray-800 hover:text-gray-600 transition-colors">About</a>
        <a href="contact_us.txt" class="text-gray-800 hover:text-gray-600 transition-colors">Contact</a>
      </div>
    </div>
  </nav>

  <!-- Patient List Section -->
  <section class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-50 to-purple-50 pt-20"> <!-- Added pt-20 for top padding -->
    <div class="container mx-auto px-4 py-8">
      <h2 class="text-3xl font-bold text-gray-800 mb-8 text-center">Patient Records</h2>
      
      <!-- Patient List Table -->
      <div class="glassmorphism p-6">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Age</th>
              <th>Gender</th>
              <th>Diagnosis</th>
              <th>Created At</th>
            </tr>
          </thead>
          <tbody id="patientTableBody">
            <!-- Patient rows will be dynamically inserted here -->
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-white bg-opacity-80 backdrop-filter backdrop-blur-lg p-6 text-center">
    <p class="text-gray-600">&copy; 2025 हृदय-lay. All rights reserved.</p>
  </footer>

  <!-- JavaScript for Fetching Patient Records -->
  <script>
    async function fetchPatientRecords() {
      try {
        // Fetch patient records from the backend
        const response = await fetch('/api/getPatientRecords');
        if (!response.ok) {
          throw new Error('Failed to fetch patient records');
        }

        const data = await response.json();

        // Update the table with fetched data
        const tableBody = document.getElementById('patientTableBody');
        tableBody.innerHTML = ''; // Clear existing rows

        if (data.length === 0) {
          tableBody.innerHTML = `
            <tr>
              <td colspan="5" class="text-center text-gray-600 py-4">No patient records found.</td>
            </tr>
          `;
        } else {
          data.forEach(patient => {
            const row = document.createElement('tr');
            row.innerHTML = `
              <td>${patient.name}</td>
              <td>${patient.age}</td>
              <td>${patient.gender}</td>
              <td>${patient.diagnosis}</td>
              <td>${new Date(patient.created_at).toLocaleString()}</td>
            `;
            tableBody.appendChild(row);
          });
        }
      } catch (error) {
        console.error('Error fetching patient records:', error);
        alert('Failed to fetch patient records. Please try again.');
      }
    }

    // Fetch patient records when the page loads
    fetchPatientRecords();
  </script>

</body>
</html>
